  <line x1="0" y1="410" x2="612" y2="410" stroke="#C4A882" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="198" y1="40" x2="198" y2="590" stroke="#C4A882" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="396" y1="40" x2="396" y2="590" stroke="#C4A882" stroke-width="0.5" stroke-dasharray="4,3"/>
  
  <!-- Bottom text -->
  <text x="306" y="630" font-family="Arial" sans-serif="sans-serif" font-size="11" text-anchor="middle" fill="#5C4A3A">🎃 12 Spooky Gift Tags — Print on cardstock, cut out, and attach!</text>
  <text x="306" y="650" font-family="Arial" sans-serif="sans-serif" font-size="9" text-anchor="middle" fill="#aaa">© 2026 Latte Paws · lattepaws.com</text>
