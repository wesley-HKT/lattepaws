<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Latte Paws Halloween Bandana Pattern -->
    <pattern id="halloween-bg" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="300" height="300" fill="#1A1A2E"/>
      
      <!-- Stars -->
      <polygon points="40,30 42,38 50,38 44,43 46,51 40,46 34,51 36,43 30,38 38,38" fill="#F5D742" opacity="0.6"/>
      <polygon points="260,80 261,85 266,85 262,88 263,93 260,90 257,93 258,88 254,85 259,85" fill="#F5D742" opacity="0.4"/>
      <polygon points="150,50 151,55 156,55 152,58 153,63 150,60 147,63 148,58 144,55 149,55" fill="#F5D742" opacity="0.5"/>
      <polygon points="80,150 81,155 86,155 82,158 83,163 80,160 77,163 78,158 74,155 79,155" fill="#F5D742" opacity="0.3"/>
      <polygon points="230,200 231,205 236,205 232,208 233,213 230,210 227,213 228,208 224,205 229,205" fill="#F5D742" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#halloween-bg)"/>
  
  <!-- === DOG IN PUMPKIN COSTUME === -->
  <g transform="translate(200, 400)">
    <!-- Pumpkin body -->
    <ellipse cx="0" cy="0" rx="90" ry="75" fill="#E67E22"/>
    <ellipse cx="0" cy="0" rx="75" ry="75" fill="#D35400"/>
    <ellipse cx="0" cy="0" rx="60" ry="75" fill="#E67E22"/>
    <ellipse cx="0" cy="0" rx="45" ry="75" fill="#F39C12"/>
    
    <!-- Pumpkin ridges -->
    <path d="M 0 -75 Q 10 -50 10 0 Q 10 50 0 75" fill="none" stroke="#D35400" stroke-width="2"/>
    <path d="M 0 -75 Q -10 -50 -10 0 Q -10 50 0 75" fill="none" stroke="#D35400" stroke-width="2"/>
    
    <!-- Dog head popping out -->
    <circle cx="0" cy="-70" r="45" fill="#C4956A"/>
    <ellipse cx="-28" cy="-90" rx="15" ry="22" fill="#C4956A" transform="rotate(-20 -28 -90)"/>
    <ellipse cx="28" cy="-90" rx="15" ry="22" fill="#C4956A" transform="rotate(20 28 -90)"/>
    
    <!-- Dog face -->
    <circle cx="-14" cy="-72" r="7" fill="#2C3E50"/>
    <circle cx="14" cy="-72" r="7" fill="#2C3E50"/>
    <circle cx="-10" cy="-74" r="3" fill="white"/>
    <circle cx="18" cy="-74" r="3" fill="white"/>
    <ellipse cx="0" cy="-58" rx="6" ry="4" fill="#2C3E50"/>
    <path d="M -6 -52 Q 0 -44 6 -52" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <path d="M -3 -48 Q 0 -44 3 -48" fill="#E74C3C"/>
    
    <!-- Pumpkin stem -->
    <rect x="-5" y="-115" width="10" height="18" rx="2" fill="#27AE60"/>
    
    <!-- Pumpkin vine -->
    <path d="M 5 -115 Q 25 -130 15 -140" fill="none" stroke="#27AE60" stroke-width="2"/>
  </g>
  
  <!-- === GHOST DOG === -->
  <g transform="translate(600, 380)">
    <!-- Ghost body -->
    <path d="M -50 -30 Q -50 -80 0 -80 Q 50 -80 50 -30 L 50 40 Q 40 30 30 40 Q 20 30 10 40 Q 0 30 -10 40 Q -20 30 -30 40 Q -40 30 -50 40 Z" fill="#F0F0F0" opacity="0.9"/>
    
    <!-- Ghost eyes -->
    <circle cx="-15" cy="-30" r="10" fill="#1A1A2E"/>
    <circle cx="15" cy="-30" r="10" fill="#1A1A2E"/>
    <circle cx="-12" cy="-33" r="3" fill="white"/>
    <circle cx="18" cy="-33" r="3" fill="white"/>
    
    <!-- Ghost mouth -->
    <ellipse cx="0" cy="-10" rx="8" ry="5" fill="#1A1A2E"/>
    
    <!-- Dog ears on ghost -->
    <ellipse cx="-40" cy="-55" rx="12" ry="18" fill="#F0F0F0" transform="rotate(-20 -40 -55)"/>
    <ellipse cx="40" cy="-55" rx="12" ry="18" fill="#F0F0F0" transform="rotate(20 40 -55)"/>
  </g>
  
  <!-- === WITCH HAT DOG === -->
  <g transform="translate(1000, 400)">
    <!-- Dog body -->
    <circle cx="0" cy="10" r="45" fill="#8B4513"/>
    <ellipse cx="-30" cy="-10" rx="14" ry="20" fill="#8B4513" transform="rotate(-15 -30 -10)"/>
    <ellipse cx="30" cy="-10" rx="14" ry="20" fill="#8B4513" transform="rotate(15 30 -10)"/>
    
    <!-- Dog face -->
    <circle cx="-14" cy="0" r="7" fill="#2C3E50"/>
    <circle cx="14" cy="0" r="7" fill="#2C3E50"/>
    <circle cx="-10" cy="-2" r="3" fill="white"/>
    <circle cx="18" cy="-2" r="3" fill="white"/>
    <ellipse cx="0" cy="12" rx="6" ry="4" fill="#2C3E50"/>
    <path d="M -6 18 Q 0 26 6 18" fill="none" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Witch hat -->
    <path d="M -40 -35 L 0 -120 L 40 -35" fill="#1A1A2E"/>
    <rect x="-45" y="-40" width="90" height="12" rx="3" fill="#1A1A2E"/>
    <rect x="-42" y="-38" width="84" height="6" rx="2" fill="#8E44AD"/>
    
    <!-- Hat buckle -->
    <rect x="-6" y="-50" width="12" height="15" rx="2" fill="#F5D742"/>
    <rect x="-3" y="-47" width="6" height="9" rx="1" fill="#1A1A2E"/>
  </g>
  
  <!-- === BATS === -->
  <g transform="translate(350, 180)" opacity="0.7">
    <path d="M 0 0 Q -20 -15 -40 0 Q -20 -10 0 0" fill="#1A1A2E"/>
    <path d="M 0 0 Q 20 -15 40 0 Q 20 -10 0 0" fill="#1A1A2E"/>
    <circle cx="0" cy="3" r="4" fill="#1A1A2E"/>
  </g>
  <g transform="translate(850, 150)" opacity="0.5">
    <path d="M 0 0 Q -15 -12 -30 0 Q -15 -8 0 0" fill="#1A1A2E"/>
    <path d="M 0 0 Q 15 -12 30 0 Q 15 -8 0 0" fill="#1A1A2E"/>
    <circle cx="0" cy="3" r="3" fill="#1A1A2E"/>
  </g>
  <g transform="translate(150, 250)" opacity="0.4">
    <path d="M 0 0 Q -12 -10 -24 0 Q -12 -6 0 0" fill="#1A1A2E"/>
    <path d="M 0 0 Q 12 -10 24 0 Q 12 -6 0 0" fill="#1A1A2E"/>
    <circle cx="0" cy="2" r="2.5" fill="#1A1A2E"/>
  </g>
  
  <!-- === MOON === -->
  <circle cx="100" cy="120" r="50" fill="#F5D742" opacity="0.8"/>
  <circle cx="120" cy="110" r="45" fill="#1A1A2E"/>
  
  <!-- === TEXT BANNER === -->
  <g transform="translate(600, 900)">
    <rect x="-350" y="-40" width="700" height="70" rx="10" fill="none" stroke="#F5D742" stroke-width="3"/>
    <text x="0" y="10" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#F5D742">🦇 LATTE PAWS HALLOWEEN 🦇</text>
  </g>
  
  <!-- === CAT CORNERS === -->
  <g transform="translate(50, 950)">
    <polygon points="30,0 60,60 0,60" fill="#F5D742" opacity="0.8"/>
    <polygon points="30,5 55,55 5,55" fill="#E67E22" opacity="0.9"/>
  </g>
  <g transform="translate(1120, 950) rotate(90)">
    <polygon points="30,0 60,60 0,60" fill="#F5D742" opacity="0.8"/>
    <polygon points="30,5 55,55 5,55" fill="#E67E22" opacity="0.9"/>
  </g>
  
  <!-- === SMALL PUMPKINS === -->
  <g transform="translate(550, 1050)">
    <ellipse cx="0" cy="0" rx="12" ry="10" fill="#E67E22"/>
    <rect x="-2" y="-12" width="4" height="5" rx="1" fill="#27AE60"/>
  </g>
  <g transform="translate(650, 1060)">
    <ellipse cx="0" cy="0" rx="10" ry="8" fill="#D35400"/>
    <rect x="-2" y="-10" width="4" height="4" rx="1" fill="#27AE60"/>
  </g>
  
  <!-- === SPIDER WEB === -->
  <g transform="translate(1150, 200)" opacity="0.4">
    <path d="M 0 0 L -30 -30 M 0 0 L 0 -40 M 0 0 L 30 -30" fill="none" stroke="white" stroke-width="1"/>
    <path d="M -25 -25 Q 0 -20 25 -25" fill="none" stroke="white" stroke-width="0.5"/>
    <path d="M -18 -18 Q 0 -15 18 -18" fill="none" stroke="white" stroke-width="0.5"/>
    <path d="M -10 -10 Q 0 -8 10 -10" fill="none" stroke="white" stroke-width="0.5"/>
  </g>
</svg>